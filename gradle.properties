# Gradle / JVM
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft
minecraft_version=1.21.1

# Mod
mod_id=dpibypassdetect
mod_name=DPI Bypass Detect
mod_license=PolyForm Shield 1.0.0
mod_version=0.1.0
mod_group_id=games.brennan.dpibypassdetect
mod_authors=Brennan Hatton
mod_description=A tiny client-side library that tells other mods whether a DPI-bypass tool (zapret, GoodbyeDPI) is running, by matching running process names, so they can explain silently failing connections. Nothing leaves your machine.

# Architectury — enabled loader platforms
enabled_platforms=fabric,forge,neoforge

# Fabric
fabric_loader_version=0.16.5
fabric_api_version=0.103.0+1.21.1

# Forge — 1.21.1-52.x line
forge_version=1.21.1-52.1.14

# NeoForge
neoforge_version=21.1.228
