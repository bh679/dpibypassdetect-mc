modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/bh679/dpibypassdetect-mc/issues"

[[mods]]
modId="dpibypassdetect"
version="${version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
displayURL="https://github.com/bh679/dpibypassdetect-mc"
# Client-side library: a server never needs it, and a client with it can join a server without it.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.dpibypassdetect]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.dpibypassdetect]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"
